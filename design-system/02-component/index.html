<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button component</title>
    <link rel="stylesheet" href="button.css">
    <link rel="stylesheet" href="../01-tokens/tokens.css">
</head>
<body>
    <h1 class="align-center">Button Variants</h1>
    <div class="btn-grid">
        <div class="btn-column">
            <h2>Primary variant</h2>
            <button class="btn btn--primary btn--lg">Click Me</button>
            <button class="btn btn--primary btn--md">Click Me</button>
            <button class="btn btn--primary btn--sm">Click Me</button>
            <button class="btn btn--primary btn--sm" disabled>Disabled</button>
        </div>
        <div class="btn-column">
            <h2>Secondary variant</h2>
            <button class="btn btn--secondary btn--lg">Click Me</button>
            <button class="btn btn--secondary btn--md">Click Me</button>
            <button class="btn btn--secondary btn--sm">Click Me</button>
            <button class="btn btn--secondary btn--sm" disabled>Disabled</button>
        </div>
        <div class="btn-column">
            <h2>Destructive variant</h2>
            <button class="btn btn--destructive btn--lg">Click Me</button>
            <button class="btn btn--destructive btn--md">Click Me</button>
            <button class="btn btn--destructive btn--sm">Click Me</button>
            <button class="btn btn--destructive btn--sm" disabled>Disabled</button>
        </div>
    </div>

    <section id="preview">
        <h2 class="align-center">Live Component Preview</h2>
        <div class="preview-btn-container align-center">
            <button id="preview-btn" class="btn">Click me</button>
        </div>
        <div class="preview-controls">
            <div class="select-group">
                <label for="variant-select">Variant</label>
                <select name="variants" id="variant-select">
                    <option value="">Choose a variant:</option>
                    <option value="primary">Primary</option>
                    <option value="secondary">Secondary</option>
                    <option value="destructive">Destructive</option>
                </select>
            </div>
            <div class="select-group">
                <label for="size-select">Size</label>
                <select name="sizes" id="size-select">
                    <option value="">Choose a size:</option>
                    <option value="sm">Small</option>
                    <option value="md">Medium</option>
                    <option value="lg">Large</option>
                </select>
            </div>

            <div class="radio-group">
                <label for="disabled-select">Disabled</label>
                <input type="checkbox" id="disabled-toggle">
            </div>
        </div>
    </section>
    <script src="button.js"></script>
</body>
</html>
