<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button component</title>
    <link rel="stylesheet" href="button.css">
    <link rel="stylesheet" href="demo.css">
    <link rel="stylesheet" href="../01-tokens/tokens.css">
</head>
<body>
    <main>
        <h1 class="align-center">Button Variants</h1>
        <div class="btn-grid">
            <div class="btn-column">
                <h2>Primary variant</h2>
                <button class="btn btn--primary btn--lg" type="button">Click Me</button>
                <button class="btn btn--primary btn--md" type="button">Click Me</button>
                <button class="btn btn--primary btn--sm" type="button">Click Me</button>
                <button class="btn btn--primary btn--sm" disabled type="button">Disabled</button>
            </div>
            <div class="btn-column">
                <h2>Secondary variant</h2>
                <button class="btn btn--secondary btn--lg" type="button">Click Me</button>
                <button class="btn btn--secondary btn--md" type="button">Click Me</button>
                <button class="btn btn--secondary btn--sm" type="button">Click Me</button>
                <button class="btn btn--secondary btn--sm" disabled type="button">Disabled</button>
            </div>
            <div class="btn-column">
                <h2>Destructive variant</h2>
                <button class="btn btn--destructive btn--lg" type="button">Click Me</button>
                <button class="btn btn--destructive btn--md" type="button">Click Me</button>
                <button class="btn btn--destructive btn--sm" type="button">Click Me</button>
                <button class="btn btn--destructive btn--sm" disabled type="button">Disabled</button>
            </div>
        </div>
        <section id="preview">
            <h2 class="align-center">Live Component Preview</h2>
            <div class="preview-btn-container align-center">
                <button id="preview-btn" class="btn btn--primary btn--md" type="button">Click me</button>
            </div>
            <div class="preview-controls">
                <div class="select-group">
                    <label for="variant-select">Variant</label>
                    <select name="variants" id="variant-select">
                        <option value="">Choose a variant:</option>
                        <option value="primary" selected>Primary</option>
                        <option value="secondary">Secondary</option>
                        <option value="destructive">Destructive</option>
                    </select>
                </div>
                <div class="select-group">
                    <label for="size-select">Size</label>
                    <select name="sizes" id="size-select">
                        <option value="">Choose a size:</option>
                        <option value="sm">Small</option>
                        <option value="md" selected>Medium</option>
                        <option value="lg">Large</option>
                    </select>
                </div>
                <div class="checkbox-group">
                    <label for="disabled-toggle">Disabled</label>
                    <input type="checkbox" id="disabled-toggle">
                </div>
            </div>
        </section>
    </main>
    <script src="button.js"></script>
</body>
</html>
