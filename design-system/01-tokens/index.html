<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Tokens</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1 class="align-center">Token System</h1>
    <div class="token-grid">
        <section id="colors">
            <article class="token-card" data-token="--color-primary-50">
                <div class="color-swatch" style="background-color: var(--color-primary-50)"></div>
                <div class="token-details">
                    <dt class="var-name"></dt>
                    <dd class="var-value"></dd>
                </div>
            </article>

            <article class="token-card" data-token="--color-primary-100">
                <div class="color-swatch" style="background-color: var(--color-primary-100)"></div>
                <div class="token-details">
                    <dt class="var-name"></dt>
                    <dd class="var-value"></dd>
                </div>
            </article>

            <article class="token-card" data-token="--color-primary-200">
                <div class="color-swatch" style="background-color: var(--color-primary-200)"></div>
                <div class="token-details">
                    <dt class="var-name"></dt>
                    <dd class="var-value"></dd>
                </div>
            </article>

            <article class="token-card" data-token="--color-primary-500">
                <div class="color-swatch" style="background-color: var(--color-primary-500)"></div>
                <div class="token-details">
                    <dt class="var-name"></dt>
                    <dd class="var-value"></dd>
                </div>
            </article>

            <article class="token-card" data-token="--color-primary-600">
                <div class="color-swatch" style="background-color: var(--color-primary-600)"></div>
                <div class="token-details">
                    <dt class="var-name"></dt>
                    <dd class="var-value"></dd>
                </div>
            </article>

            <article class="token-card" data-token="--color-primary-700">
                <div class="color-swatch" style="background-color: var(--color-primary-700)"></div>
                <div class="token-label">
                    <dt class="var-name"></dt>
                    <dd class="var-value"></dd>
                </div>
            </article>
        </section>

        <section id="typography">
            <div style="font-size: var(--font-size-3xl)">Lorem ipsum dolor sit amet.</div>
            <div style="font-size: var(--font-size-3xl)">Lorem ipsum dolor sit amet.</div>
            <div style="font-size: var(--font-size-2xl)">Lorem ipsum dolor sit amet.</div>
            <div style="font-size: var(--font-size-xl)">Lorem ipsum dolor sit amet.</div>
            <div style="font-size: var(--font-size-lg)">Lorem ipsum dolor sit amet</div>
            <div style="font-size: var(--font-size-base)">Lorem ipsum dolor sit amet</div>
            <div style="font-size: var(--font-size-md)">Lorem ipsum dolor sit amet</div>
            <div style="font-size: var(--font-size-sm)">Lorem ipsum dolor sit amet</div>
            <div style="font-size: var(--font-size-xs)">Lorem ipsum dolor sit amet</div>
        </section>

        <section id="spacing">
            <article class="token-card" data-token="--spacing-12">
                <div class="spacing-bar" style="width: var(--spacing-12)"></div>
                <div class="token-label">
                    <dt class="var-name"></dt>
                    <dd class="var-value"></dd>
                </div>
            </article>

            <article class="token-card" data-token="--spacing-10">
                <div class="spacing-bar" style="width: var(--spacing-10)"></div>

                    <dt class="var-name"></dt>

            </article>

            <article class="token-card" data-token="--spacing-8">

            </article>

            <article class="token-card" data-token="--spacing-6">

                    <dt class="var-name"></dt>

                </div>
            </article>

            <article class="token-card" data-token="--spacing-5">

                <div class="token-label">
                    <dt class="var-name"></dt>
                    <dd class="var-value"></dd>
                </div>
            </article>

            <article class="token-card" data-token="--spacing-4">
                <div class="spacing-bar" style="width: var(--spacing-4)"></div>

                    <dt class="var-name"></dt>
                    <dd class="var-value"></dd>
                </div>
            </article>

            <article class="token-card" data-token="--spacing-3">

                    <dt class="var-name"></dt>

                    <dt class="var-name"></dt>

        </section>

    </div>
    
    <script src="main.js"></script>
</body>
</html>
