<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button component</title>
    <link rel="stylesheet" href="button.css">
    <link rel="stylesheet" href="../01-tokens/tokens.css">
</head>
<body>
    <h1>Button Variants</h1>
    <div class="btn-grid">
        <div class="btn-column">
            <h2>Primary variant</h2>
            <button class="btn btn--primary btn--lg">Click Me</button>
            <button class="btn btn--primary btn--md">Click Me</button>
            <button class="btn btn--primary btn--sm">Click Me</button>
            <button class="btn btn--primary btn--sm" disabled>Disabled</button>
        </div>
        <div class="btn-column">
            <h2>Secondary variant</h2>
            <button class="btn btn--secondary btn--lg">Click Me</button>
            <button class="btn btn--secondary btn--md">Click Me</button>
            <button class="btn btn--secondary btn--sm">Click Me</button>
            <button class="btn btn--secondary btn--sm" disabled>Disabled</button>
        </div>
        <div class="btn-column">
            <h2>Destructive variant</h2>
            <button class="btn btn--destructive btn--lg">Click Me</button>
            <button class="btn btn--destructive btn--md">Click Me</button>
            <button class="btn btn--destructive btn--sm">Click Me</button>
            <button class="btn btn--destructive btn--sm" disabled>Disabled</button>
        </div>
    </div>
</body>
</html>
